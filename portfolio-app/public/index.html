    <!-- Fonts are SELF-HOSTED (public/fonts/) rather than loaded from
         fonts.googleapis.com. Privacy blockers — notably Brave Shields — block
         cross-origin font requests, which left the site rendering in fallback
         system fonts (reported in the wild). Serving them from our own origin
         means nothing can block them. font-display:swap keeps text visible while
         they load; each face is still weight/subset-split so only what's needed
         is fetched. Loaded non-render-blocking (media=print → all on load), with
         a <noscript> copy so it still applies when JS is off. -->
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/fonts.css" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="%PUBLIC_URL%/fonts/fonts.css" />
    </noscript>
    <title>Naseeruddin Shaik — Software Engineer | Java, Spring Boot & Data Science</title>
    <style>
      /* Anti-flash: dark background on BODY only. Do NOT set a background on
         <html> — that stops body-background propagation to the viewport and
         paints an opaque layer over the negative-z-index effects (particles,
         aurora, beam), hiding them. */
      html,
      body {
        margin: 0;
      }
      body {
        background: #05060d;
      }
    </style>
    <script>
      // Runs before paint. Gates scroll-reveal and the intro loader, with
      // safety timers so content always appears even if the bundle fails.
      (function () {
        var d = document.documentElement;
        // Apply the saved theme BEFORE paint so there's no flash. Dark is the
        // default (the site's original look); only 'light' is stamped.
        try {
          if (localStorage.getItem('theme') === 'light') d.setAttribute('data-theme', 'light');
        } catch (e) {}
        var reduce = false;
        try {
          reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (e) {}
        if ('IntersectionObserver' in window) d.classList.add('is-ready');
        if (!reduce) d.classList.add('intro-active');
        // Safety net: force-reveal all content ONLY if the React bundle never
        // boots (JS stalled). The app cancels this timer on mount (see App.tsx)
        // via window.__revealFallbackTimer — otherwise a fixed timer would fire
        // while the visitor is still in the pinned cinematic intro and
        // permanently kill every scroll-reveal animation below the fold. Bumped
        // to 8s so a slow-but-working boot never trips it before React cancels.
        window.__revealFallbackTimer = setTimeout(function () {
          d.classList.add('reveal-fallback');
        }, 8000);
        // Release the hero even if JS stalls (independent safety net).
        setTimeout(function () {
          d.classList.remove('intro-active');
        }, 6000);
      })();
    </script>
  </head>
  <body>
    <!-- Shown ONLY when JavaScript is disabled (e.g. Brave "Block scripts"
         Shield). This is exactly the audience whose greeting / footer robot /
         animations can't load, so they get a friendly heads-up instead of a
         blank-looking page. Normal visitors never see it. Inline styles because
         the app's CSS is JS-injected and won't be present either. -->
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#05060d;color:#eaf0fb;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;box-sizing:border-box;">
        <div style="max-width:30rem;text-align:center;">
          <div style="font-size:2.25rem;margin-bottom:0.75rem;">✨</div>
          <h1 style="font-size:1.4rem;font-weight:700;margin:0 0 0.75rem;color:#ffffff;">Naseeruddin Shaik</h1>
          <p style="font-size:1rem;line-height:1.6;margin:0 0 1.25rem;color:#aab6cc;">
            Please <strong style="color:#8b7bff;">enable JavaScript</strong> for the full experience — the greeting,
            animations, and interactive elements need it to run.
          </p>
          <p style="font-size:0.85rem;line-height:1.6;margin:0;color:#7c88a0;">
            On Brave, click the <strong style="color:#aab6cc;">Shields</strong> icon in the address bar and allow
            scripts for this site, then reload.
          </p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
